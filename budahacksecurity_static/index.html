<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/main.css">

    <link rel="shortcut icon" href="assets/img/favicon_ico/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon_ico/favicon-32.png">

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <body>

    <!-- ░░ BACKGROUND LAYERS ░░ -->

    <!-- 1. Matrix Rain -->
    <canvas id="matrix-canvas"></canvas>

    <!-- 2. Hex Grid SVG -->
    <div id="hex-grid-layer">
      <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hexPat" x="0" y="0" width="56" height="48" patternUnits="userSpaceOnUse">
            <polygon points="28,2 52,14 52,38 28,50 4,38 4,14"
              fill="none" stroke="#cc0000" stroke-width="0.7"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#hexPat)" />
      </svg>
    </div>

    <!-- 3. Classified watermark (JS lo rellena) -->
    <div id="classified-watermark"></div>

    <!-- 4. Scanline moving bar -->
    <div id="scanline-bar"></div>

    <!-- 5. Noise texture -->
    <div id="noise-layer"></div>

    <!-- 6. Vignette -->
    <div id="vignette-layer"></div>

    <!-- 7. Corner brackets -->
    <div class="corner-bracket corner-tl"></div>
    <div class="corner-bracket corner-tr"></div>
    <div class="corner-bracket corner-bl"></div>
    <div class="corner-bracket corner-br"></div>

    <!-- 8. Radar canvas -->
    <canvas id="radar-canvas" width="180" height="180"></canvas>

    <!-- ░░ STATUS BARS ░░ -->
    <div id="top-status-bar">
      <span class="tsci">⚠ TOP SECRET // SCI // NOFORN</span>
      <span class="enc-blink" id="enc-label">▌ ENCRYPTED CHANNEL ACTIVE ▌</span>
      <span id="status-clock">00:00:00 UTC | NODE: TOR-0000</span>
    </div>

    <div id="bottom-status-bar">
      <span>◉ SECURE_CONN: <b class="g">ESTABLISHED</b></span>
      <span>PACKETS_RX: <b class="g" id="pkt">0</b></span>
      <span>ENCRYPT: <b class="g">AES-256-GCM</b></span>
      <span>TOR_HOP: <b class="g">3/3</b></span>
      <span style="margin-left:auto">CLASSIFICATION: <b class="r">TOP SECRET</b></span>
    </div>

    <!-- ░░ REACT ROOT ░░ -->
    <div id="root" class="content-wrapper"></div>

    <!-- ░░ REACT APP ░░ -->
    <script type="text/babel">
      const { useState, useEffect } = React;

      function Navbar() {
        return (
          <nav className="navbar navbar-expand-lg navbar-dark">
            <div className="container-fluid">
              <a className="navbar-brand d-flex align-items-center" href="index.html">
                <img src="assets/img/la.png" alt="Logo ByteZero" className="navbar-logo me-2" />
                <span>Buda Hack Security</span>
              </a>
              <button className="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span className="navbar-toggler-icon"></span>
              </button>
              <div className="collapse navbar-collapse" id="navbarNav">
                <ul className="navbar-nav me-auto mb-2 mb-lg-0">
                  <li className="nav-item">
                    <a className="nav-link active" aria-current="page" href="index.html">Home</a>
                  </li>
                  <li className="nav-item">
                    <a className="nav-link" href="about.html">About</a>
                  </li>
                  <li className="nav-item">
                    <a className="nav-link" href="gallery.html">Gallery</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        );
      }

      function TerminalSection() {
        return (
          <section className="terminal-hero d-flex align-items-center py-4">
            <div className="container">
              <div className="terminal-classified mx-auto">
                <div className="terminal-titlebar">
                  <span className="dot dot-red"></span>
                  <span className="dot dot-orange"></span>
                  <span className="dot dot-green"></span>
                  <span className="terminal-label">ROOT@BUDAHACK — ENCRYPTED</span>
                </div>
                <pre id="term-output" aria-live="polite" role="status"></pre>
                <div className="term-input">
                  <span className="cursor">█</span>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function HeroSection() {
        return (
          <section className="hero text-center py-4">
            <div className="container">
              <div className="classified-stamp">TS/SCI — NOFORN — RESTRICTED</div>
              <h1 className="display-4 neon mt-2" data-text="Welcome to Buda Hack Security">
                Welcome to Buda Hack Security
              </h1>
              <p className="lead mt-2">Pentest explorations, labs and write-ups</p>
            </div>
          </section>
        );
      }

      function CardsSection() {
        const cards = [
          {
            img: "assets/img/logi.png",
            alt: "Laboratorios de pentest y análisis de malware",
            text: "Step-by-step labs on attack techniques and malware development for educational purposes.",
            href: "malwarelabs.html"
          },
          {
            img: "assets/img/logo.png",
            alt: "Documentación de pentest y Red Team",
            text: "Practical documentation for pentesting and Red Teams (guides and procedures).",
            href: "redteam.html"
          },
          {
            img: "assets/img/write.png",
            alt: "Writeups de máquinas CTF TryHackMe Hack The Box DockerLabs",
            text: "CTF machine write-ups (TryHackMe, Hack The Box, DockerLabs) with step-by-step solutions.",
            href: "writeups.html"
          }
        ];
        return (
          <div className="container my-5">
            <div className="section-divider">[ AUTHORIZED MODULES ]</div>
            <div className="row justify-content-center text-center mt-4">
              {cards.map((card, i) => (
                <div key={i} className="col-md-4 mb-4">
                  <div className="card bg-dark text-light card-classified">
                    <div className="card-clearance-tag">[DECLASSIFIED]</div>
                    <img src={card.img} className="card-img-top" alt={card.alt} />
                    <div className="card-body">
                      <p className="card-text">{card.text}</p>
                      <a href={card.href} className="btn btn-neon mt-3">Ir</a>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AlertBanner() {
        return (
          <div className="alert fade show custom-alert mx-3" role="alert">
            <strong>⚠️ Warning:</strong> All content on this site is for informational purposes{' '}
            <b>educational and ethical</b>.
            I am not responsible for the misuse of the information learned.
          </div>
        );
      }

      function Footer() {
        return (
          <footer className="footer text-center text-light py-4">
            <div className="container">
              <h5 className="footer-title">Buda Hack Security</h5>
              <p className="footer-subtitle">Pentest explorations, labs &amp; write-ups</p>
              <div className="footer-social my-3">
                <a href="https://github.com/buda-sys/buda-sys" className="social-link">
                  <i className="bi bi-github"></i>
                </a>
                <a href="https://discord.gg/mqXsQYN3" className="social-link">
                  <i className="bi bi-discord"></i>
                </a>
                <a href="contact.html" className="social-link">
                  <i className="bi bi-envelope"></i>
                </a>
                <a href="disclaimer.html" className="social-link" title="Legal Disclaimer & Responsible Use">
                  <i className="bi bi-shield-check"></i>
                </a>
              </div>
              <p className="footer-copy mt-3 mb-0">
                © 2025 <span className="text-danger">Buda Hack Security</span> — All rights reserved.
              </p>
            </div>
          </footer>
        );
      }

      function App() {
        return (
          <>
            <Navbar />
            <TerminalSection />
            <HeroSection />
            <CardsSection />
            <AlertBanner />
            <Footer />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Buy Me a Coffee -->
    <script data-name="BMC-Widget" data-cfasync="false"
      src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js"
      data-id="krav0" data-description="Apoya a Buda Hack Security"
      data-message="Gracias por el apoyo ☕" data-color="#FF0033"
      data-position="Right" data-x_margin="18" data-y_margin="18">
    </script>

    <!-- terminal.js — espera a que React monte #term-output -->
    <script>
      (function waitMount(n) {
        if (document.getElementById('term-output')) {
          var s = document.createElement('script');
          s.src = 'assets/js/terminal.js';
          document.body.appendChild(s);
        } else if (n < 60) {
          setTimeout(function(){ waitMount(n + 1); }, 100);
        }
      })(0);
    </script>

    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>

  </body>
</html>
