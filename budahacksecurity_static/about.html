/* ASCII BANNER — solo sidebar, dividido en 2 bloques para que entre */
function AsciiBanner() {
  const [lines, setLines] = useState(ASCII_LINES);
  const intervalRef = useRef(null);
  const frameRef = useRef(null);

  useEffect(() => {
    const triggerGlitch = () => {
      let frame = 0;
      const glitch = () => {
        frame++;
        setLines(ASCII_LINES.map(line =>
          Math.random() > 0.55
            ? line
            : line.split('').map(ch => Math.random() > 0.88 ? GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)] : ch).join('')
        ));
        if (frame < 18) frameRef.current = setTimeout(glitch, 40);
        else setLines(ASCII_LINES);
      };
      glitch();
    };
    intervalRef.current = setInterval(triggerGlitch, 4800);
    return () => { clearInterval(intervalRef.current); clearTimeout(frameRef.current); };
  }, []);

  return (
    <div style={{
      position:'relative', background:'rgba(0,0,0,.92)',
      border:'1px solid rgba(0,255,255,.15)', borderRadius:2,
      padding:'12px 8px 8px', overflow:'hidden', marginBottom:0,
      boxShadow:'inset 0 0 40px rgba(0,255,255,.05)'
    }}>
      {/* Scanline sweep */}
      <div style={{position:'absolute',left:0,right:0,height:'18%',background:'linear-gradient(to bottom,transparent,rgba(0,255,255,.04),transparent)',animation:'scanline-move 3.5s linear infinite',pointerEvents:'none',zIndex:2}}/>
      {/* Main text */}
      <pre style={{
        fontFamily:"'Share Tech Mono',monospace",
        fontSize:'clamp(5px,0.95vw,8px)',
        lineHeight:1.4, color:'#00ffff',
        textShadow:'0 0 8px rgba(0,255,255,.7), 0 0 20px rgba(0,255,255,.3)',
        animation:'ascii-flicker 6s step-end infinite',
        whiteSpace:'pre', overflow:'hidden', position:'relative', zIndex:1,
        letterSpacing:'0.02em', margin:0
      }}>
        {lines.map((l,i)=><div key={i}>{l}</div>)}
      </pre>
      {/* Ghost red */}
      <pre aria-hidden style={{
        fontFamily:"'Share Tech Mono',monospace", fontSize:'clamp(5px,0.95vw,8px)',
        lineHeight:1.4, color:'#ff2d78', opacity:0.3,
        whiteSpace:'pre', overflow:'hidden',
        position:'absolute', top:12, left:8,
        transform:'translate(2px,0)',
        animation:'ascii-glitch-1 6s step-end infinite',
        pointerEvents:'none', zIndex:3, margin:0

        {ASCII_LINES.map((l,i)=><div key={i}>{l}</div>)}
      </pre>
      {/* Ghost cyan */}
      <pre aria-hidden style={{
        fontFamily:"'Share Tech Mono',monospace", fontSize:'clamp(5px,0.95vw,8px)',
        lineHeight:1.4, color:'#00ffff', opacity:0.15,

        transform:'translate(-2px,0)',
        animation:'ascii-glitch-2 6s step-end infinite',

/* STATUS BADGE */
function StatusBadge() {
  const [uptime, setUptime] = useState(0);
  const startRef = useRef(Date.now());
  useEffect(() => {
    const BASE = 7*24*3600 + 4*3600 + 22*60 + 11;
    const iv = setInterval(() => setUptime(Math.floor((Date.now()-startRef.current)/1000)+BASE), 1000);
    return () => clearInterval(iv);
  }, []);
  const fmt = s => {
    const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600),
          m=Math.floor((s%3600)/60), sec=s%60;
    return `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
  };
  return (
    <div style={{background:'rgba(0,255,65,.05)',border:'1px solid rgba(0,255,65,.2)',padding:'10px 12px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>

  );
}

    const resize=()=>{sc.width=sc.offsetWidth;sc.height=sc.offsetHeight;};
    resize(); window.addEventListener('resize',resize);
    const cols=['rgba(0,255,255,','rgba(255,45,120,','rgba(255,230,0,','rgba(255,255,255,'];
    const stars=Array.from({length:110},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height,s:Math.random()>.85?2:1,b:Math.random()*Math.PI*2,sp:Math.random()*.015+.005,c:cols[Math.random()*4|0]}));
    let raf;
    const draw=()=>{ctx.clearRect(0,0,sc.width,sc.height);stars.forEach(s=>{s.b+=s.sp;const a=.15+.6*Math.abs(Math.sin(s.b));ctx.fillStyle=s.c+a+')';ctx.fillRect(s.x,s.y,s.s,s.s);});raf=requestAnimationFrame(draw);};
    draw();
    return()=>{window.removeEventListener('resize',resize);cancelAnimationFrame(raf);};
  },[]);
  return <canvas ref={ref} style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}}/>;
}

/* TYPEWRITER */
function Typewriter({text}) {
  const [idx,setIdx]=useState(0);
  useEffect(()=>{
    setIdx(0);
    const iv=setInterval(()=>setIdx(i=>{if(i<text.length)return i+1;clearInterval(iv);return i;}),110);
    return()=>clearInterval(iv);
  },[text]);
  return <span>{text.slice(0,idx)}<span style={{animation:'blink-slow .8s step-end infinite',color:'#00ffff'}}>_</span></span>;
}

    <div style={{position:'absolute',width:20,height:20,pointerEvents:'none',zIndex:7,transform:`rotate(${rot})`,...s}}>
      <div style={{position:'absolute',width:'100%',height:2,top:0,left:0,background:'#00ffff',boxShadow:'0 0 8px #00ffff'}}/>
      <div style={{position:'absolute',width:2,height:'100%',top:0,left:0,background:'#00ffff',boxShadow:'0 0 8px #00ffff'}}/>

}
